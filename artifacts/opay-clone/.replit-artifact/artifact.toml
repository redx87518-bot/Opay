kind = "mobile"
previewPath = "/"
title = "OPay Clone"
description = "A full-featured OPay fintech mobile app replica for Nigeria. Includes onboarding, sign up, login, biometric auth, PIN setup, dashboard with wallet balance, add money, send money, airtime, data, bill payments, transaction history, receipts, and settings. All transactions are simulated."
version = "1.0.0"
id = "artifacts/opay-clone"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24894

[services.development]
run = "pnpm --filter @workspace/opay-clone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/opay-clone", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/opay-clone", "run", "serve" ]

[services.env]
PORT = "24894"
BASE_PATH = "/"

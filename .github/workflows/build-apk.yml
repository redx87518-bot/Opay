name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: false
        default: 'debug'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Expo prebuild
        uses: actions/cache@v4
        with:
          path: |
            artifacts/opay-clone/android
            artifacts/opay-clone/.expo
          key: expo-android-${{ hashFiles('artifacts/opay-clone/package.json') }}
          restore-keys: |
            expo-android-

      - name: Install Expo CLI
        run: npm install -g @expo/cli@latest

      - name: Generate native Android project
        working-directory: artifacts/opay-clone
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_CAPABILITY_SYNC: 1

      - name: Install Android dependencies
        working-directory: artifacts/opay-clone/android
        run: ./gradlew dependencies --configuration releaseRuntimeClasspath || true

      - name: Make gradlew executable
        working-directory: artifacts/opay-clone/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: artifacts/opay-clone/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: Sign Release APK (if keystore provided)
        if: github.event.inputs.build_type == 'release' && secrets.KEYSTORE_BASE64 != ''
        working-directory: artifacts/opay-clone/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/opay-release.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/opay-release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: List APK output
        run: |
          echo "=== APK files found ==="
          find artifacts/opay-clone/android -name "*.apk" -type f
          echo "======================"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: opay-debug-${{ github.run_number }}.apk
          path: artifacts/opay-clone/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK (if built)
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: opay-release-${{ github.run_number }}.apk
          path: artifacts/opay-clone/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: OPay Clone Build ${{ github.run_number }}
          body: |
            ## OPay Clone APK Build ${{ github.run_number }}

            Automated build from commit ${{ github.sha }}

            ### Installation
            1. Download the APK file below
            2. Enable "Install from unknown sources" on your Android device
            3. Install the APK

            ### Features
            - Dashboard with wallet balance
            - Add Money, Send Money, Airtime, Data, Bills, Transfer
            - PIN-secured transactions
            - Transaction history and receipts
            - Settings and Profile management
          files: |
            artifacts/opay-clone/android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
        continue-on-error: true
